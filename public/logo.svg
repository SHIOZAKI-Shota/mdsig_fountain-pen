<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21.25 -10 332 230" width="332" height="230">
  <title>md-signature</title>
  <!--
    幾何ルール
    ・線幅はすべて 30（グリッド 10 × 3）
    ・# は 210×210 の正方形グリッド上で 3等分（線 60–90 / 120–150）を、
      tan = 1/4 で斜体化（skewX、中心 y=105 基準）
    ・✓ は直角に折れる線、短辺:長辺 = 1:4、各辺 45°
    ・✓ の内角の隙間の頂点 = # の右縦線と下の横線の交点（146.25, 120）
    ・✓ まわりの隙間は線幅の 1/3（10）
  -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="-50" y="-50" width="420" height="320">
      <rect x="-50" y="-50" width="420" height="320" fill="#fff"/>
      <polyline points="103.179,112.284 146.25,155.355 297.321,4.284" fill="none" stroke="#000" stroke-width="50" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <!-- ✓ の長い辺の外側（右下）には # を出さない -->
      <polygon points="384.96,-50 420,-50 420,270 64.96,270" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <g fill="#6C5FEA" transform="matrix(1 0 -0.25 1 26.25 0)">
      <rect x="60"  y="0"   width="30" height="210"/>
      <rect x="120" y="0"   width="30" height="210"/>
      <rect x="0"   y="60"  width="210" height="30"/>
      <rect x="0"   y="120" width="210" height="30"/>
    </g>
  </g>
  <polyline points="110.25,119.355 146.25,155.355 290.25,11.355" fill="none" stroke="#1BB5AD" stroke-width="30" stroke-linejoin="miter" stroke-miterlimit="10"/>
</svg>
